<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Hairdresser | Home</title>

    <!-- Custom CSS-->
     <link rel="stylesheet" href="assets/css/styles.css">

     <!-- Credit: Bootstrap CSS link-->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<!-- Classes on body set to work with mt-auto on footer to ensure it always stays at the bottom of the page-->
<body class="d-flex flex-column min-vh-100">

    <!--Navigation-->
    <div>Navigation</div>

    <!--Header with carousel-->
    <header class="container">
        <div class="row">
            <div class="col-12 col-xl-6">Hairdresser</div>
            <div class="col-12 col-xl-6">carousel</div>
        </div>
    </header>

    <!--main element to hold all key sections of the home page. It is not part of the grid structure -->
    <main>
        <!-- Services section -->
         <section class="container">
            <div class="row">
                <div class="col-12">Services Section Heading</div>
                <div class="col-12 col-md-6 col-xl-3">Service 1</div>
                <div class="col-12 col-md-6 col-xl-3">Service 2</div>
                <div class="col-12 col-md-6 col-xl-3">Service 3</div>
                <div class="col-12 col-md-6 col-xl-3">Service 4</div>
            </div>
         </section>
    </main>

    <!-- Footer / contact section -->
     <!-- mt-auto added to push footer to the bottom of the page -->
     <footer class="mt-auto">
        <div class="row justigy-content-center">
            <div class="col-12">Contact Section Heading</div>
            <!-- Contact info -->
            <div class="col-12 col-md-6 col-xl-4">Contact info & Social links</div>
            <!-- Opening Times-->
            <div class="col-12 col-md-6 col-xl-4">Opening Times</div>

        </div>

     </footer>

    <!-- Credit: Bootstrap JS script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <!-- Credit: Font Awesome Kit-->
    <script src="https://kit.fontawesome.com/b8c91933cc.js" crossorigin="anonymous"></script>

</body>
</html>
